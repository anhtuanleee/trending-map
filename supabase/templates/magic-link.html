<!doctype html>
<html lang="vi">
  <body style="margin: 0; background: #f4f7f5; font-family: Arial, sans-serif; color: #10231f">
    <div style="max-width: 520px; margin: 0 auto; padding: 40px 20px">
      <div
        style="background: #ffffff; border-radius: 16px; padding: 32px; border: 1px solid #dce6e2"
      >
        <p
          style="
            margin: 0 0 8px;
            color: #13795b;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
          "
        >
          MẠCH PHỐ
        </p>
        <h1 style="margin: 0 0 16px; font-size: 24px">Mã đăng nhập của bạn</h1>
        <p style="margin: 0 0 24px; line-height: 1.6; color: #50635e">
          Nhập mã bên dưới vào ứng dụng để tiếp tục đóng góp cho bản đồ cộng đồng.
        </p>
        <div
          style="
            padding: 18px;
            border-radius: 12px;
            background: #e7f3ee;
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 0.18em;
            color: #0e684f;
          "
        >
          {{ .Token }}
        </div>
        <p style="margin: 24px 0 0; line-height: 1.6; color: #75847f; font-size: 13px">
          Nếu bạn không yêu cầu mã này, hãy bỏ qua email. Không chia sẻ mã cho bất kỳ ai.
        </p>
      </div>
    </div>
  </body>
</html>
