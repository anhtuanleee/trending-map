project_id = "trending-map"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "trendingmap://auth"
additional_redirect_urls = ["trendingmap://auth/callback", "http://localhost:3000/**"]
enable_signup = true

[auth.email.template.magic_link]
subject = "Mã đăng nhập Trending Map"
content_path = "./supabase/templates/magic-link.html"

[functions.submit-report]
verify_jwt = true

[functions.confirm-report]
verify_jwt = true

[functions.add-report-update]
verify_jwt = true

[functions.create-report-media-upload]
verify_jwt = true

[functions.complete-report-media-upload]
verify_jwt = true

[functions.get-report-media-moderation-queue]
verify_jwt = true

[functions.moderate-report-media]
verify_jwt = true
